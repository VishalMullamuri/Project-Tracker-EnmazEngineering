name: CI

on:
  push:
    branches:
      - review-fixes
  pull_request:
    branches:
      - review-fixes

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: project_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run Ruff
        run: |
          cd backend
          ruff check .

      - name: Run Tests
        env:
          SECRET_KEY: "ci-only-not-a-real-secret-0123456789abcdef"
          ALGORITHM: HS256
        run: |
          cd backend
          pytest